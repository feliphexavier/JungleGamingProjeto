services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: apostas
      POSTGRES_PASSWORD: apostas
      POSTGRES_DB: apostas
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apostas -d apostas"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: