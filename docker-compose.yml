# Configuração comum das instâncias da API.
x-api: &api
  image: jungle-wallet:local
  build: .
  environment:
    HTTP_PORT: "8080"
    DATABASE_URL: postgres://apostas:apostas@postgres:5432/apostas?sslmode=disable
    OIDC_ISSUER: http://localhost:8081/realms/wallet
    OIDC_JWKS_URL: http://keycloak:8080/realms/wallet/protocol/openid-connect/certs
    OIDC_AUDIENCE: wallet-api
    SHUTDOWN_TIMEOUT: 20s
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    SQS_ENDPOINT: http://localstack:4566
    SQS_INBOUND_QUEUE: wager-operations.fifo
    SQS_DLQ: wager-operations-dlq.fifo
    SQS_EVENTS_QUEUE: wallet-events.fifo
  depends_on:
    migrate:
      condition: service_completed_successfully
    keycloak:
      condition: service_healthy
    localstack:
      condition: service_healthy
  # Tempo entre SIGTERM e SIGKILL: maior que SHUTDOWN_TIMEOUT.
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: apostas
      POSTGRES_PASSWORD: apostas
      POSTGRES_DB: apostas
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apostas -d apostas"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  # IdP OAuth 2.0 / OIDC. O realm "wallet" (clients e papéis) é importado na subida.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      # Emissor fixo (iss) para tokens pedidos de dentro ou de fora do Docker;
      # chamadas internas (JWKS) continuam usando http://keycloak:8080.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # SQS local. As filas são criadas pelo hook deploy/localstack/init-queues.sh.
  localstack:
    image: localstack/localstack:4.9
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./deploy/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
    healthcheck:
      # Pronto só depois que o hook terminou de criar as filas.
      test: ["CMD-SHELL", "curl -sf localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Aplica as migrations e termina; a API só sobe depois que ele conclui.
  migrate:
    image: jungle-wallet:local
    build: .
    entrypoint: ["/app/migrate", "up"]
    environment:
      DATABASE_URL: postgres://apostas:apostas@postgres:5432/apostas?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Três instâncias independentes (processos e containers separados) sobre o
  # mesmo PostgreSQL e as mesmas filas: nenhuma garantia depende de estado em
  # memória. Todas atendem HTTP, consomem o SQS e publicam a outbox.
  api:
    <<: *api
    ports:
      - "8080:8080"

  api-2:
    <<: *api
    ports:
      - "8082:8080"

  api-3:
    <<: *api
    ports:
      - "8083:8080"

volumes:
  pgdata:
